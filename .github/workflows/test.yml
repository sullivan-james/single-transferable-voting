name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -v

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: stv.exe
            zip: stv-${{ github.ref_name }}-windows.zip
          - os: macos-latest
            artifact: stv
            zip: stv-${{ github.ref_name }}-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --onefile src/stv.py

      - name: Build executable (macOS universal)
        if: runner.os == 'macOS'
        run: pyinstaller --onefile --target-arch universal2 src/stv.py

      - name: Package release (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist\stv.exe, README.md -DestinationPath ${{ matrix.zip }}

      - name: Package release (macOS)
        if: runner.os == 'macOS'
        run: zip ${{ matrix.zip }} dist/${{ matrix.artifact }} README.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: ${{ matrix.zip }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: "**/*.zip"
